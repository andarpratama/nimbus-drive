version: "3.8"

services:
  app:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    volumes:
      - ./server:/app
      - ./server/uploads:/app/uploads:rw
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=nimbus
      - DB_PASSWORD=secret
      - DB_NAME=nimbus_drive
      - REDIS_ADDR=redis:6379
      - JWT_SECRET=your-super-secret-jwt-key-change-this-in-production
      - PORT=8080
      - APP_DEBUG=true
      - UPLOAD_DIR=/app/uploads
      - MAX_FILE_SIZE=10485760
    command: sh -c "mkdir -p /app/uploads && chmod 755 /app/uploads && air"
    depends_on:
      - db
      - redis

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"           # Vite default port
    volumes:
      - ./client:/app
      - /app/node_modules     # Exclude node_modules from host mount
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    env_file:
      - .env
    stdin_open: true          # required for Vite HMR
    tty: true

  db:
    image: mysql:8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: nimbus_drive
      MYSQL_USER: nimbus
      MYSQL_PASSWORD: secret
    ports:
      - "3307:3306"

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
